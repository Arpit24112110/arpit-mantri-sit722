name: CI Pipeline

on:
  push:
    branches:
      - testing

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customers
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/order_service/requirements.txt
          pip install -r backend/customer_service/requirements.txt

      - name: Run tests for Order Service
        run: |
          cd backend/order_service
          pytest --maxfail=1 --disable-warnings -q

      - name: Run tests for Customer Service
        run: |
          cd backend/customer_service
          pytest --maxfail=1 --disable-warnings -q

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name arpit722acr999

      - name: Build and push Docker images
        run: |
          docker build -t arpit722acr999.azurecr.io/order_service:latest ./backend/order_service
          docker build -t arpit722acr999.azurecr.io/customer_service:latest ./backend/customer_service
          docker push arpit722acr999.azurecr.io/order_service:latest
          docker push arpit722acr999.azurecr.io/customer_service:latest
