name: CI Pipeline

on:
  push:
    branches:
      - testing

jobs:
  # 1. Customer Service Tests
  test-customer-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          cd backend/customer_service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest
      - name: Run tests
        run: |
          cd backend/customer_service
          pytest -v

  # 2. Order Service Tests
  test-order-service:
    runs-on: ubuntu-latest
    needs: test-customer-service
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          cd backend/order_service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest
      - name: Run tests
        run: |
          cd backend/order_service
          pytest -v

  # 3. Product Service Tests
  test-product-service:
    runs-on: ubuntu-latest
    needs: test-order-service
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: products
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          cd backend/product_service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest
      - name: Run tests
        run: |
          cd backend/product_service
          pytest -v

  # 4. Build & Push Docker Images (only if all tests pass)
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-customer-service, test-order-service, test-product-service]
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Container Registry login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push customer-service
        run: |
          cd backend/customer_service
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/customer-service:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/customer-service:latest

      - name: Build and push order-service
        run: |
          cd backend/order_service
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/order-service:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/order-service:latest

      - name: Build and push product-service
        run: |
          cd backend/product_service
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/product-service:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/product-service:latest

      - name: Build and push frontend
        run: |
          cd frontend
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/frontend:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/frontend:latest
