name: CI Pipeline

on:
  push:
    branches:
      - testing
      - main

jobs:
  # 1. Customer Service Tests
  test-customer-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          cd backend/customer_service
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest
      - name: Run tests
        run: |
          cd backend/customer_service
          pytest -v

  # 2. Order Service Tests
  test-order-service:
    runs-on: ubuntu-latest
    needs: test-customer-service
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          cd backend/order_service
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest
      - name: Run tests
        run: |
          cd backend/order_service
          pytest -v

  # 3. Product Service Tests
  test-product-service:
    runs-on: ubuntu-latest
    needs: test-order-service
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: products
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          cd backend/product_service
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest
      - name: Run tests
        run: |
          cd backend/product_service
          pytest -v

  # 4. Build & Push Docker Images
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-customer-service, test-order-service, test-product-service]
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        uses: azure/docker-login@v1
        with:
          login-server: sit722acr224752512.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container

      - name: Build and push customer-service
        run: |
          DOCKER_BUILDKIT=1 docker build -t sit722acr224752512.azurecr.io/customer-service:latest ./backend/customer_service
          docker push sit722acr224752512.azurecr.io/customer-service:latest

      - name: Build and push order-service
        run: |
          DOCKER_BUILDKIT=1 docker build -t sit722acr224752512.azurecr.io/order-service:latest ./backend/order_service
          docker push sit722acr224752512.azurecr.io/order-service:latest

      - name: Build and push product-service
        run: |
          DOCKER_BUILDKIT=1 docker build -t sit722acr224752512.azurecr.io/product-service:latest ./backend/product_service
          docker push sit722acr224752512.azurecr.io/product-service:latest

      - name: Build and push frontend
        run: |
          DOCKER_BUILDKIT=1 docker build -t sit722acr224752512.azurecr.io/frontend:latest ./frontend
          docker push sit722acr224752512.azurecr.io/frontend:latest

  # 5. Deploy to Staging (only on testing branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/testing'
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to staging
        run: |
          echo "Creating temporary staging environment..."
          az container create \
            --resource-group sit722-rg \
            --name staging-env \
            --image sit722acr224752512.azurecr.io/frontend:latest \
            --registry-login-server sit722acr224752512.azurecr.io \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --dns-name-label sit722-staging-${{ github.run_id }} \
            --ports 3000
          echo "Staging environment running at:"
          echo "http://sit722-staging-${{ github.run_id }}.australiaeast.azurecontainer.io:3000"

      - name: Acceptance Test
        run: |
          echo "Waiting for staging app to boot..."
          sleep 20
          curl -f http://sit722-staging-${{ github.run_id }}.australiaeast.azurecontainer.io:3000

      - name: Destroy staging
        if: always()
        run: |
          echo "Destroying staging environment..."
          az container delete --resource-group sit722-rg --name staging-env --yes

  # 6. Deploy to Production (only on main branch)
  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to production
        run: |
          echo "Deploying latest images to production environment..."
          az container create \
            --resource-group sit722-rg \
            --name prod-env \
            --image sit722acr224752512.azurecr.io/frontend:latest \
            --registry-login-server sit722acr224752512.azurecr.io \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --dns-name-label sit722-prod \
            --ports 3000
